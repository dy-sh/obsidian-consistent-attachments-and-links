name: Feature request
description: Request a feature and help improve the plugin
title: "[FR] Don't forget to write a meaningful title"
labels: enhancement
assignees: mnaoumov
body:
  - type: markdown
    attributes:
      value: |
        ## Feature request

        > [!WARNING]
        >
        > Incomplete, vague, or poorly described requests will be closed.
        >
        > The feature request and all attachments (screenshots, videos, sample vaults) must be in English. Exception: the request is directly related to non-English language usage. Non-English feature requests will be closed.
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the feature request. Include any relevant details.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case
      description: Describe a scenario where this feature would be useful.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired behavior
      description: What do you want to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: What actually happens?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: ⚠️ Must be the latest version. If not, explain why above.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Obsidian version
      description: ⚠️ Must be the latest version. If not, explain why above.
      placeholder: 1.3.2
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attachments
      description: Optional, but strongly encouraged. Attach a video showing the current behavior and a sample vault where the feature could be applied. They help the maintainer understand the request and speed up the implementation.
      placeholder: Drag and drop files here.
  - type: dropdown
    attributes:
      label: Video
      description: Optional, but strongly encouraged.
      options:
        - "Not attached. ⚠️ Providing a video helps the maintainer understand the request and speeds up implementation."
        - "Attached"
  - type: dropdown
    attributes:
      label: Sample vault
      description: Optional, but strongly encouraged.
      options:
        - "Not attached. ⚠️ Providing a sample vault helps the maintainer understand the request and speeds up implementation."
        - "Attached"
  - type: checkboxes
    attributes:
      label: Confirmations
      description: Ensure the following conditions are met
      options:
        - label: I have checked the plugin's GitHub repository and haven't found any similar feature requests
          required: true
